    <script>
      // Early language + JS detection (keep in sync with src/i18n/index.tsx detectLocale()).
      ;(function () {
        var d = document.documentElement
        var L = ['id', 'en', 'ms']
        function match(t) {
          t = (t || '').toLowerCase()
          if (t.indexOf('id') === 0 || t.indexOf('in') === 0) return 'id'
          if (t.indexOf('ms') === 0 || t.indexOf('zsm') === 0) return 'ms'
          if (t.indexOf('en') === 0) return 'en'
          return null
        }
        var lang = null
        try {
          var q = new URLSearchParams(location.search).get('lang')
          if (L.indexOf(q) > -1) lang = q
          if (!lang) {
            var s = localStorage.getItem('saat.lang')
            if (L.indexOf(s) > -1) lang = s
          }
        } catch (e) {}
        if (!lang) {
          var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]
          for (var i = 0; i < ls.length && !lang; i++) lang = match(ls[i])
        }
        lang = lang || 'id'
        d.lang = lang
        d.className += ' js' + (lang !== 'id' ? ' lang-pending' : '')
        // Failsafe: if the app never boots, reveal everything.
        setTimeout(function () {
          if (!window.__saatBooted) d.className = d.className.replace(/\b(js|lang-pending)\b/g, '')
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript><style>[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
